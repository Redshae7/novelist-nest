<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Novelist Nest</title>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--sf:#141420;--sf2:#1c1c2e;--bd:#2a2a3e;--t1:#e8e6e1;--t2:#8b8999;--ac:#c4956a;--ac2:#8b6f4e;--gw:rgba(196,149,106,0.12);--ok:#4a9e6e;--er:#c45a5a}
body{background:var(--bg);color:var(--t1);font-family:'Crimson Pro',Georgia,serif;min-height:100dvh}
input,textarea,button,select{font-family:'Crimson Pro',Georgia,serif}
a{color:var(--ac)}

/* LAYOUT */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--bd);background:var(--sf);position:sticky;top:0;z-index:50;gap:8px}
.logo{font-family:'Playfair Display',serif;font-size:18px;font-weight:800;color:var(--ac);white-space:nowrap;cursor:pointer}
.logo small{color:var(--t2);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;display:block;font-family:'Crimson Pro',serif}
.phases{display:flex;gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.phases::-webkit-scrollbar{display:none}
.ph{padding:6px 12px;border-radius:6px;border:1px solid var(--bd);background:transparent;color:var(--t2);cursor:pointer;font-size:12px;white-space:nowrap;transition:all .2s}
.ph.on{border-color:var(--ac);background:var(--gw);color:var(--ac);font-weight:600}
.ph.locked{opacity:.4;cursor:not-allowed}
.layout{display:flex;height:calc(100dvh - 56px)}
@media(max-width:768px){.layout{flex-direction:column;height:auto;min-height:calc(100dvh - 56px)}}

/* SIDEBAR */
.sidebar{width:240px;min-width:240px;border-right:1px solid var(--bd);background:var(--sf);padding:16px;overflow-y:auto}
@media(max-width:768px){.sidebar{display:none}}
.sb-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;color:var(--t2);margin-bottom:8px}
.sb-input{width:100%;padding:8px 12px;border-radius:6px;border:1px solid var(--bd);background:var(--sf2);color:var(--t1);font-size:13px;outline:none;margin-bottom:8px}
.sb-row{display:flex;gap:6px}
.sb-row .sb-input:last-child{width:40px;text-align:center;flex-shrink:0}
.sb-row .sb-input:first-child{flex:1}
.sb-ch{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:6px;border:1px solid transparent;color:var(--t2);cursor:pointer;font-size:12px;margin-bottom:2px;text-align:left;width:100%;background:transparent}
.sb-ch:hover,.sb-ch.on{border-color:var(--ac);color:var(--ac);background:var(--gw)}
.sb-ch .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sb-ch .dot.done{background:var(--ok)}
.sb-ch .dot.todo{background:var(--bd)}
.sb-ch .dot.locked{background:var(--er);opacity:.4}
.sb-progress{margin-top:12px;padding:10px;background:var(--sf2);border-radius:8px}
.sb-progress .bar-bg{height:4px;background:var(--bd);border-radius:2px;margin-top:6px}
.sb-progress .bar-fill{height:100%;background:var(--ac);border-radius:2px;transition:width .5s}

/* MAIN */
.main{flex:1;padding:20px;overflow-y:auto}
@media(max-width:768px){.main{padding:16px}}
.panel{display:none;max-width:720px;margin:0 auto}
.panel.show{display:block}
h2{font-family:'Playfair Display',serif;font-size:clamp(22px,4vw,28px);font-weight:800;margin-bottom:6px}
.sub{color:var(--t2);font-size:14px;margin-bottom:20px}

/* COMPONENTS */
.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:20px;margin-bottom:14px}
.lb{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;color:var(--t2);margin-bottom:8px;display:block}
.inp{width:100%;padding:10px 14px;border-radius:6px;border:1px solid var(--bd);background:var(--sf2);color:var(--t1);font-size:14px;outline:none}
textarea.inp{min-height:100px;resize:vertical;line-height:1.6}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{padding:5px 12px;border-radius:6px;border:1px solid var(--bd);background:transparent;color:var(--t2);cursor:pointer;font-size:12px;transition:all .15s}
.tag.on{border-color:var(--ac);background:var(--gw);color:var(--ac);font-weight:600}
.btn{padding:12px 24px;border-radius:8px;background:var(--ac);color:#fff;border:none;cursor:pointer;font-size:14px;font-weight:600;transition:all .2s}
.btn:hover{background:var(--ac2)}.btn:disabled{opacity:.5;cursor:default}
.btn-sm{padding:6px 14px;font-size:11px}
.btn-full{width:100%}
.btn-o{background:transparent;border:1px solid var(--bd);color:var(--t2)}
.btn-o:hover{border-color:var(--ac);color:var(--ac)}
.btn-success{background:var(--ok);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:768px){.grid2{grid-template-columns:1fr}}
.len-btn{display:block;width:100%;text-align:left;padding:8px 12px;margin-bottom:4px}
.len-btn b{display:block}.len-btn span{font-size:11px;opacity:.6}
.chapter-text{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:24px;white-space:pre-wrap;font-size:15px;line-height:1.85;max-height:600px;overflow-y:auto;margin-top:12px}
.ol-item{display:flex;gap:12px;align-items:flex-start}
.ol-num{width:34px;height:34px;border-radius:50%;background:var(--gw);border:1px solid var(--ac);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--ac);flex-shrink:0}
.ol-body{flex:1}.ol-body h4{font-size:15px;font-weight:600;margin-bottom:4px}
.ol-body p{font-size:13px;color:var(--t2);line-height:1.5}
.head-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.sep{height:1px;background:var(--bd);margin:14px 0}
.fr{display:flex;justify-content:flex-end;margin-top:16px}
.notify{position:fixed;top:16px;right:16px;z-index:200;background:var(--ac);color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.3);display:none}
.notify.show{display:block}
.kw{display:inline-block;padding:3px 10px;border-radius:16px;background:var(--gw);border:1px solid var(--ac);color:var(--ac);font-size:11px;margin:2px}
.chk{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px;color:var(--t2)}
.chk input[type=checkbox]{accent-color:var(--ac);width:16px;height:16px}
.cl-title{font-weight:600;font-size:13px;color:var(--ac);margin-bottom:6px}
.cl-section{margin-bottom:14px}
.plat-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.plat-row span:last-child{margin-left:auto;color:var(--ac)}

/* UPGRADE PROMPT */
.upgrade-card{background:linear-gradient(135deg,#1a1a2e,#16213e);border:1px solid var(--ac);border-radius:14px;padding:32px;text-align:center;margin:20px 0}
.upgrade-card h3{font-family:'Playfair Display',serif;font-size:22px;color:var(--ac);margin-bottom:8px}
.upgrade-card p{color:var(--t2);font-size:14px;margin-bottom:20px;line-height:1.6}
.upgrade-card .price{font-family:'Playfair Display',serif;font-size:36px;font-weight:800;color:var(--t1);margin-bottom:4px}
.upgrade-card .price-sub{font-size:13px;color:var(--t2);margin-bottom:16px}

/* COMPLETION SCREEN */
.complete-screen{text-align:center;padding:40px 20px}
.complete-screen .trophy{font-size:72px;margin-bottom:16px}
.complete-screen h2{font-size:32px;margin-bottom:12px;color:var(--ac)}
.complete-screen p{color:var(--t2);font-size:16px;line-height:1.6;max-width:500px;margin:0 auto 24px}

/* BETA GATE */
.beta-gate{display:flex;align-items:center;justify-content:center;min-height:100dvh;padding:20px}
.beta-box{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:48px 40px;text-align:center;max-width:420px;width:100%}
.beta-box h1{font-family:'Playfair Display',serif;font-size:28px;color:var(--ac);margin-bottom:8px}
.beta-box p{color:var(--t2);font-size:14px;margin-bottom:24px;line-height:1.6}
.beta-box input{width:100%;padding:14px;border-radius:8px;border:1px solid var(--bd);background:var(--sf2);color:var(--t1);font-size:16px;text-align:center;outline:none;margin-bottom:12px;letter-spacing:2px}
.beta-box .err{color:var(--er);font-size:13px;margin-bottom:12px;min-height:18px}
.beta-badge{display:inline-block;padding:4px 12px;border-radius:20px;background:var(--gw);border:1px solid var(--ac);color:var(--ac);font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:16px}

/* GENERATION OVERLAY */
.gen-overlay{display:none;position:fixed;inset:0;background:rgba(10,10,15,0.88);backdrop-filter:blur(10px);z-index:100;align-items:center;justify-content:center;flex-direction:column}
.gen-overlay.show{display:flex}
.gen-quill{font-size:48px;margin-bottom:20px;animation:quillAnim 2s ease-in-out infinite}
@keyframes quillAnim{
  0%,100%{transform:translateX(0) rotate(0deg)}
  25%{transform:translateX(10px) rotate(4deg)}
  50%{transform:translateX(20px) rotate(0deg)}
  75%{transform:translateX(10px) rotate(-4deg)}
}
.gen-title{font-family:'Playfair Display',serif;font-size:20px;font-weight:800;color:var(--ac);margin-bottom:6px}
.gen-step{font-size:14px;color:var(--t2);margin-bottom:16px;min-height:20px;transition:opacity .3s}
.gen-bar-wrap{width:260px;height:4px;background:var(--bd);border-radius:2px;overflow:hidden}
.gen-bar{height:100%;background:linear-gradient(90deg,var(--ac2),var(--ac));border-radius:2px;transition:width .6s ease;width:0%}
.gen-dots{display:flex;gap:6px;margin-top:14px}
.gen-dots span{width:5px;height:5px;border-radius:50%;background:var(--ac);opacity:.3;animation:dp 1.2s ease-in-out infinite}
.gen-dots span:nth-child(2){animation-delay:.2s}
.gen-dots span:nth-child(3){animation-delay:.4s}
@keyframes dp{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:1;transform:scale(1.4)}}

/* LEGAL */
.legal{max-width:660px;margin:0 auto;padding:20px;font-size:14px;line-height:1.7;color:var(--t2)}
.legal h2{color:var(--t1);margin-bottom:16px}.legal h3{color:var(--t1);margin:16px 0 8px;font-size:16px}
.legal p{margin-bottom:12px}
</style>
</head>
<body>

<div class="notify" id="notify"></div>
<div class="gen-overlay" id="gen-overlay">
  <div class="gen-quill">✍️</div>
  <div class="gen-title" id="gen-title">Writing in Progress</div>
  <div class="gen-step" id="gen-step">Preparing...</div>
  <div class="gen-bar-wrap"><div class="gen-bar" id="gen-bar"></div></div>
  <div class="gen-dots"><span></span><span></span><span></span></div>
</div>

<div id="app"></div>

<script>
// ===== CONFIG =====
const FREE_CHAPTER_LIMIT = 1;
const PAID_CHAPTER_LIMIT = 25;

// ===== STATE =====
let betaAccess = localStorage.getItem("nn_beta") === "1";
let isPaid = localStorage.getItem("nn_paid") === "1";
let tosAccepted = localStorage.getItem("nn_tos") === "1.0";
let paymentChecked = false;
let paymentVerifying = false;
let phase = "idea", genre = "", tone = "", length = null, heat = "";
let outline = [], activeChapter = null, keywords = [];
let chapterTexts = {};
let editingChapter = null; // Which chapter is being edited
let bookComplete = false;
let currentView = "app"; // app | legal-tos | legal-privacy | payment-processing | edit-book
const EDIT_PASS_PRICE = "price_1TD7OwGfC89Ah6OSTBL3E0b3"; | tos-gate

const GENRES = ["Fiction","Non-Fiction","Romance","Thriller","Sci-Fi","Fantasy","Children's","Self-Help","Memoir"];
const TONES = ["Literary","Conversational","Dark","Humorous","Inspirational","Suspenseful","Romantic"];
const LENGTHS = [{l:"Novella",w:"20K-35K",c:"10-15"},{l:"Standard Novel",w:"40K-60K",c:"18-25"},{l:"Full Novel",w:"65K-90K",c:"25-35"}];
const HEATS = ["Clean","Warm","Spicy","Steamy"];

// ===== PAYMENT FUNCTIONS =====
async function startCheckout() {
  try {
    const r = await fetch("/api/create-checkout", {
      method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({})
    });
    const d = await r.json();
    if (d.url) {
      window.location.href = d.url; // Redirect to Stripe (same tab, so they come back)
    } else {
      notify("Error creating checkout: " + (d.error || "Unknown"));
    }
  } catch(e) { notify("Checkout error: " + e.message); }
}

async function verifyPayment(sessionId) {
  paymentVerifying = true;
  currentView = "payment-processing";
  render();
  try {
    const r = await fetch("/api/verify-payment", {
      method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ action: "verify", sessionId })
    });
    const d = await r.json();
    if (d.paid) {
      isPaid = true;
      localStorage.setItem("nn_paid", "1");
      paymentChecked = true;
      paymentVerifying = false;
      currentView = "payment-success";
      window.history.replaceState({}, "", "/app.html");
      render();
    } else if (d.status === "pending") {
      // Payment still processing — retry in 3 seconds
      setTimeout(() => verifyPayment(sessionId), 3000);
    } else {
      paymentVerifying = false;
      currentView = "app";
      window.history.replaceState({}, "", "/app.html");
      render();
      notify("Payment not confirmed. If you completed payment, try refreshing.");
    }
  } catch(e) {
    paymentVerifying = false;
    currentView = "app";
    render();
    notify("Verification error. Try refreshing the page.");
  }
}

async function checkPaymentStatus() {
  if (paymentChecked) return;
  try {
    const r = await fetch("/api/verify-payment", {
      method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ action: "check-status" })
    });
    const d = await r.json();
    if (d.paid) {
      isPaid = true;
      localStorage.setItem("nn_paid", "1");
    }
    paymentChecked = true;
  } catch(e) { paymentChecked = true; }
}

// ===== TOS FUNCTIONS =====
async function checkTosStatus() {
  try {
    const r = await fetch("/api/ai", {
      method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ action: "tos-check" })
    });
    const d = await r.json();
    if (d.accepted) {
      tosAccepted = true;
      localStorage.setItem("nn_tos", d.tosVersion);
    } else {
      tosAccepted = false;
      localStorage.removeItem("nn_tos");
    }
  } catch(e) {
    // If check fails and we have local acceptance, trust it temporarily
  }
}

async function acceptTos() {
  try {
    const r = await fetch("/api/ai", {
      method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ action: "tos-accept", tosVersion: "1.0", privacyVersion: "1.0" })
    });
    const d = await r.json();
    if (d.ok) {
      tosAccepted = true;
      localStorage.setItem("nn_tos", "1.0");
      currentView = "app";
      render();
      notify("Terms accepted. Welcome to Novelist Nest!");
      return true;
    } else {
      notify("Error saving acceptance. Please try again.");
      return false;
    }
  } catch(e) {
    notify("Connection error. Please try again.");
    return false;
  }
}

// ===== ON PAGE LOAD: check URL for payment return =====
(async function initPayment() {
  const params = new URLSearchParams(window.location.search);
  if (params.get("payment") === "success" && params.get("session_id")) {
    await verifyPayment(params.get("session_id"));
  } else if (params.get("payment") === "cancelled") {
    window.history.replaceState({}, "", "/app.html");
    notify("Payment cancelled. You can upgrade anytime.");
  } else {
    // Background checks
    await checkPaymentStatus();
    if (betaAccess) await checkTosStatus();
    render();
  }
})()

// ===== RENDER ROUTER =====
function render() {
  if (currentView === "payment-processing") { renderPaymentProcessing(); return; }
  if (currentView === "payment-success") { renderPaymentSuccess(); return; }
  if (currentView === "edit-result") { renderApp(); return; } // renderApp calls renderPanel
  if (currentView === "legal-tos") { renderLegalTOS(); return; }
  if (currentView === "legal-privacy") { renderLegalPrivacy(); return; }
  if (!betaAccess) { renderBetaGate(); return; }
  if (!tosAccepted) { renderTosGate(); return; }
  renderApp();
}

function renderPaymentProcessing() {
  document.getElementById("app").innerHTML = `
  <div class="beta-gate">
    <div class="beta-box" style="max-width:440px">
      <div style="font-size:40px;text-align:center;margin-bottom:12px">✨</div>
      <h1 style="font-size:22px">Processing Your Payment</h1>
      <p>We're confirming your Book Pass purchase with Stripe. This usually takes 2–5 seconds.</p>
      <div class="gen-bar-wrap" style="width:220px;margin:16px auto"><div class="gen-bar" style="width:60%;animation:pulse 1.5s ease-in-out infinite"></div></div>
      <style>@keyframes pulse{0%,100%{width:40%}50%{width:80%}}</style>
      <div id="pay-status" style="font-size:13px;color:var(--t2);margin-top:12px">Verifying with Stripe...</div>
      <div id="pay-retry" style="display:none;margin-top:16px">
        <p style="font-size:13px;color:var(--t2);margin-bottom:12px">Taking longer than expected. Your payment may still be processing.</p>
        <button class="btn" onclick="location.reload()" style="margin-right:8px">↻ Check Again</button>
        <button class="btn btn-o" onclick="currentView='app';render()">Go to App</button>
      </div>
    </div>
  </div>`;
  // Show retry after 15 seconds
  setTimeout(() => {
    const el = document.getElementById("pay-retry");
    const st = document.getElementById("pay-status");
    if (el) el.style.display = "block";
    if (st) st.textContent = "Still waiting for confirmation...";
  }, 15000);
}

function renderPaymentSuccess() {
  // Figure out the best next action
  const hasOutline = outline.length > 0;
  const writtenCount = Object.keys(chapterTexts).length;
  const nextChapter = hasOutline ? outline.find(ch => !chapterTexts[ch.number]) : null;

  let nextActionHTML = "";
  if (nextChapter) {
    nextActionHTML = `
      <p style="color:var(--t2);font-size:14px;margin-bottom:16px">All ${outline.length} chapters are now unlocked. Pick up right where you left off.</p>
      <button class="btn" onclick="currentView='app';selectChapter(${nextChapter.number})" style="padding:16px 40px;font-size:16px">
        Write Chapter ${nextChapter.number} →
      </button>`;
  } else if (hasOutline) {
    nextActionHTML = `
      <p style="color:var(--t2);font-size:14px;margin-bottom:16px">All chapters unlocked. Continue writing your book.</p>
      <button class="btn" onclick="currentView='app';phase='write';render()" style="padding:16px 40px;font-size:16px">
        Continue Writing →
      </button>`;
  } else {
    nextActionHTML = `
      <p style="color:var(--t2);font-size:14px;margin-bottom:16px">Your Book Pass is active. Start creating your book now.</p>
      <button class="btn" onclick="currentView='app';phase='idea';render()" style="padding:16px 40px;font-size:16px">
        Start Your Book →
      </button>`;
  }

  document.getElementById("app").innerHTML = `
  <div class="beta-gate">
    <div class="beta-box" style="max-width:460px">
      <div style="font-size:56px;margin-bottom:16px">🎉</div>
      <h1 style="font-size:26px;color:var(--ac)">Payment Confirmed!</h1>
      <p style="font-size:16px;margin-bottom:8px">Your <strong>Book Pass</strong> is now active.</p>
      <div style="display:inline-flex;align-items:center;gap:8px;padding:8px 20px;background:var(--gw);border:1px solid var(--ac);border-radius:8px;margin-bottom:20px">
        <span style="color:var(--ok);font-size:18px">✓</span>
        <span style="color:var(--ac);font-size:14px;font-weight:600">Up to 25 chapters unlocked</span>
      </div>
      ${nextActionHTML}
      <div style="margin-top:16px">
        <button class="btn btn-o btn-sm" onclick="currentView='app';render()">Go to Dashboard</button>
      </div>
    </div>
  </div>`;
}

// ===== BETA GATE =====
function renderBetaGate() {
  document.getElementById("app").innerHTML = `
  <div class="beta-gate">
    <div class="beta-box">
      <div class="beta-badge">Private Beta</div>
      <h1>Novelist Nest</h1>
      <p>This app is currently in private beta. Enter your access code to continue.</p>
      <input id="beta-pw" type="password" placeholder="Access Code" autocomplete="off">
      <div class="err" id="beta-err"></div>
      <button class="btn btn-full" id="beta-go">Enter Beta</button>
      <div style="margin-top:16px;font-size:12px;color:var(--t2)">
        <a href="#" onclick="currentView='legal-tos';render();return false">Terms</a> · 
        <a href="#" onclick="currentView='legal-privacy';render();return false">Privacy</a>
      </div>
    </div>
  </div>`;
  document.getElementById("beta-go").onclick = async () => {
    const pw = document.getElementById("beta-pw").value;
    if (!pw) { document.getElementById("beta-err").textContent = "Enter your code"; return; }
    document.getElementById("beta-go").disabled = true;
    document.getElementById("beta-go").textContent = "Checking...";
    try {
      const r = await fetch("/api/ai", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ action: "beta-login", password: pw })});
      const d = await r.json();
      if (d.ok) { betaAccess = true; localStorage.setItem("nn_beta", "1"); await checkTosStatus(); render(); }
      else { document.getElementById("beta-err").textContent = d.error || "Invalid code"; }
    } catch(e) { document.getElementById("beta-err").textContent = "Connection error"; }
    document.getElementById("beta-go").disabled = false;
    document.getElementById("beta-go").textContent = "Enter Beta";
  };
  document.getElementById("beta-pw").addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("beta-go").click(); });
}

// ===== API =====
async function callAI(prompt, sys, maxTok, type) {
  const r = await fetch("/api/ai", { method: "POST", headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ model: "claude-sonnet-4-20250514", max_tokens: maxTok||1000, system: sys||"You are a professional book writing assistant.", messages: [{role:"user",content:prompt}], _type: type||"chapter" })
  });
  if (!r.ok) {
    let msg = "Error " + r.status;
    try { const e = await r.json(); if (e.error === "beta-required") { betaAccess = false; localStorage.removeItem("nn_beta"); render(); throw new Error("Beta session expired"); } if (e.error === "tos-required") { tosAccepted = false; localStorage.removeItem("nn_tos"); render(); throw new Error("Please accept Terms of Service first"); } msg = e.error || msg; if (e.hint) msg += " — " + e.hint; } catch(ex) { if (ex.message.includes("Beta") || ex.message.includes("Terms")) throw ex; }
    throw new Error(msg);
  }
  return (await r.json()).content?.map(i => i.text||"").join("\n") || "";
}

// ===== CHUNKED CHAPTER WRITING =====
async function writeChapter() {
  const ch = outline.find(c => c.number === activeChapter);
  if (!ch) return;
  saveSide();
  const title = document.getElementById("sb-title")?.value || localStorage.getItem("nn_title") || "Untitled";
  const prevCh = activeChapter > 1 ? outline.find(c => c.number === activeChapter - 1) : null;
  const prevText = prevCh && chapterTexts[prevCh.number] ? chapterTexts[prevCh.number].slice(-400) : "";
  const sys = `You are a bestselling ${genre||"fiction"} author. Tone: ${tone||"literary"}. Heat: ${heat||"warm"}. Write vivid professional prose. No excessive em dashes.`;

  showGen("Writing Chapter " + ch.number, "Planning scenes...", 5);
  try {
    // Step 1: Beat sheet
    updateGen("Mapping the chapter arc...", 10);
    const beats = await callAI(`Chapter ${ch.number}: "${ch.title}" for novel "${title}". Goal: ${ch.summary}. ${prevText?"Previous ended: ..."+prevText.slice(-200):""} Create 3 scene beats. Format: Scene 1: ...\nScene 2: ...\nScene 3: ...\nBrief only.`, sys, 400, "chapter");
    const sceneLines = beats.split("\n").filter(l => l.trim().match(/^scene/i));
    const scenes = sceneLines.length >= 2 ? sceneLines : ["Scene 1: Opening","Scene 2: Development","Scene 3: Climax"];

    // Step 2: Write scenes
    let full = "";
    for (let i = 0; i < scenes.length; i++) {
      updateGen(`Writing scene ${i+1} of ${scenes.length}...`, 15 + Math.round((i/scenes.length)*55));
      const prev = full ? "\n[Previous ends:] ..." + full.slice(-300) : "";
      const txt = await callAI(`Chapter ${ch.number}: "${ch.title}" for "${title}". Plan: ${ch.summary}. Beats:\n${scenes.join("\n")}\nWRITE SCENE ${i+1}: ${scenes[i]}${prev}\n${i===0?"Start naturally.":"Continue seamlessly."} ${i===scenes.length-1?"End compellingly.":""} 400-600 words. Just prose.`, sys, 900, "chapter");
      full += (full ? "\n\n" : "") + txt.trim();
    }

    // Step 3: Polish
    updateGen("Polishing...", 85);
    const polished = await callAI(`Clean up transitions in this chapter. Fix repeated phrases. Keep all content. Return only the polished text:\n\n${full}`, sys, 1200, "chapter");
    chapterTexts[activeChapter] = (polished||full).trim();

    updateGen("Chapter complete!", 100);
    setTimeout(() => { hideGen(); render(); }, 600);
    notify("Chapter " + ch.number + " written!");
  } catch(e) {
    hideGen();
    // Show error inline with retry button instead of just a toast
    const el = document.getElementById("main-content");
    if (el) {
      el.innerHTML = `<div style="max-width:700px;margin:0 auto">
        <div class="card" style="text-align:center;padding:32px">
          <div style="font-size:32px;margin-bottom:12px">⚠️</div>
          <h3 style="margin-bottom:8px;color:var(--er)">Generation Failed</h3>
          <p style="color:var(--t2);font-size:14px;margin-bottom:16px;line-height:1.6">${escH(e.message)}</p>
          <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
            <button class="btn" onclick="writeChapter()" style="padding:12px 28px">↻ Try Again</button>
            <button class="btn btn-o" onclick="render()">Back to Chapter</button>
          </div>
          <p style="font-size:12px;color:var(--t2);margin-top:12px">If this keeps happening, wait a minute and try again. The AI service may be temporarily busy.</p>
        </div>
      </div>`;
    }
  }
}

    const pass1 = await callAI(
      `You are a professional book editor. Fix all grammar, spelling, punctuation, and sentence structure issues in this manuscript excerpt. Keep the author's voice and style intact. Return ONLY the corrected text:\n\n${text}`,
      "Professional book editor. Fix errors. Keep the author's voice.", 1200, "chapter"
    );
    updateGen("Improving flow and clarity...", 50);
    const pass2 = await callAI(
      `Polish this text for publication. Fix awkward phrasing, improve flow, ensure consistent tense and POV. Do NOT change the story or voice. Return ONLY the polished text:\n\n${pass1}`,
      "Professional book editor. Polish for publication.", 1200, "chapter"
    );
    updateGen("Finalizing...", 85);
    uploadedManuscript = pass2.trim();
    updateGen("Complete!", 100);
    setTimeout(() => { hideGen(); currentView = "edit-result"; render(); }, 600);
    notify("Manuscript edited!");
  } catch(e) { hideGen(); notify("Error: " + e.message); }
}

async function genMeta() {
  const title = localStorage.getItem("nn_title") || "Untitled";
  const premise = localStorage.getItem("nn_premise") || "";
  const btn = document.getElementById("btn-meta"); if(btn){btn.disabled=true;btn.textContent="⏳...";}
  try {
    const r = await callAI(`Metadata for: Title: ${title}, Genre: ${genre}, Premise: ${premise}. Return JSON: {"description":"2-3 paragraphs","keywords":["k1","k2","k3","k4","k5","k6","k7"]}. ONLY JSON.`, "Marketing expert. Return valid JSON only.", 800, "meta");
    const m = JSON.parse(r.replace(/```json|```/g,"").trim());
    if (m.description) { const d=document.getElementById("f-desc"); if(d) d.value=m.description; }
    if (m.keywords) { keywords=m.keywords; const kl=document.getElementById("kw-list"); if(kl) kl.innerHTML=keywords.map(k=>'<span class="kw">'+k+'</span>').join(""); }
    notify("Metadata generated!");
  } catch(e) { notify("Error: "+e.message); }
  if(btn){btn.disabled=false;btn.textContent="✨ Auto-Generate";}
}
